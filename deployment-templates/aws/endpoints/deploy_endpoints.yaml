AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Deploy two Ubuntu 24.04 (Noble) EC2 instances ("inside" and "outside").
  Each instance gets two NICs: eth0 on the management subnet (with an EIP
  for SSH access) and eth1 on the data subnet (inside or outside).

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: automation
    Description: Prefix for resource names.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair name to enable SSH key authentication.

  LinuxUsername:
    Type: String
    Default: ubuntu
    Description: Username to use/create on both EC2 instances. (If it already exists, it will be reused.)

  LinuxPassword:
    Type: String
    Default: 'c0mpleX@1209'
    NoEcho: true
    Description: Password for the user.

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type.
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large

  MgmtSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Management subnet ID (eth0) - used for SSH access via EIP.

  InsideSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Inside data subnet ID (eth1 of inside instance).

  OutsideSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Outside data subnet ID (eth1 of outside instance).

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group ID for EC2 instances (must allow inbound TCP/22 from your IP for SSH).

  UbuntuNobleAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu 24.04 LTS (Noble) AMI via SSM public parameter.

Resources:
  # -------- Inside endpoint --------
  InsideMgmtENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref MgmtSubnetId
      Ipv6AddressCount: 1
      GroupSet:
        - !Ref SecurityGroupId
      Description: !Sub "${ResourceNamePrefix}-inside-mgmt-eni"
      Tags:
        - Key: Name
          Value: !Sub "${ResourceNamePrefix}-inside-mgmt-eni"

  InsideDataENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref InsideSubnetId
      Ipv6AddressCount: 1
      GroupSet:
        - !Ref SecurityGroupId
      Description: !Sub "${ResourceNamePrefix}-inside-data-eni"
      Tags:
        - Key: Name
          Value: !Sub "${ResourceNamePrefix}-inside-data-eni"

  LinuxInsideInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref UbuntuNobleAmiId
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref InsideMgmtENI
          DeviceIndex: 0
        - NetworkInterfaceId: !Ref InsideDataENI
          DeviceIndex: 1
      Tags:
        - Key: Name
          Value: !Sub "${ResourceNamePrefix}-linux-inside"
        - Key: autostop
          Value: 'false'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          apt-get update -y
          apt-get install -y nmap apache2 iperf3 net-tools

  LinuxInsideEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ResourceNamePrefix}-linux-inside-eip"

  LinuxInsideEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    DependsOn: LinuxInsideInstance
    Properties:
      AllocationId: !GetAtt LinuxInsideEIP.AllocationId
      NetworkInterfaceId: !Ref InsideMgmtENI

  # -------- Outside endpoint --------
  OutsideMgmtENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref MgmtSubnetId
      Ipv6AddressCount: 1
      GroupSet:
        - !Ref SecurityGroupId
      Description: !Sub "${ResourceNamePrefix}-outside-mgmt-eni"
      Tags:
        - Key: Name
          Value: !Sub "${ResourceNamePrefix}-outside-mgmt-eni"

  OutsideDataENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref OutsideSubnetId
      Ipv6AddressCount: 1
      GroupSet:
        - !Ref SecurityGroupId
      Description: !Sub "${ResourceNamePrefix}-outside-data-eni"
      Tags:
        - Key: Name
          Value: !Sub "${ResourceNamePrefix}-outside-data-eni"

  LinuxOutsideInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref UbuntuNobleAmiId
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref OutsideMgmtENI
          DeviceIndex: 0
        - NetworkInterfaceId: !Ref OutsideDataENI
          DeviceIndex: 1
      Tags:
        - Key: Name
          Value: !Sub "${ResourceNamePrefix}-linux-outside"
        - Key: autostop
          Value: 'false'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          apt-get update -y
          apt-get install -y nmap apache2 iperf3 net-tools

  LinuxOutsideEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ResourceNamePrefix}-linux-outside-eip"

  LinuxOutsideEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    DependsOn: LinuxOutsideInstance
    Properties:
      AllocationId: !GetAtt LinuxOutsideEIP.AllocationId
      NetworkInterfaceId: !Ref OutsideMgmtENI

Outputs:
  LinuxInsidePublicIP:
    Description: Public IPv4 address of the inside instance (mgmt EIP)
    Value: !Ref LinuxInsideEIP

  LinuxInsidePrivateIP:
    Description: Private IPv4 address of the inside instance (mgmt interface)
    Value: !GetAtt InsideMgmtENI.PrimaryPrivateIpAddress

  LinuxInsideDataIP:
    Description: Private IPv4 address of the inside data interface
    Value: !GetAtt InsideDataENI.PrimaryPrivateIpAddress

  LinuxOutsidePublicIP:
    Description: Public IPv4 address of the outside instance (mgmt EIP)
    Value: !Ref LinuxOutsideEIP

  LinuxOutsidePrivateIP:
    Description: Private IPv4 address of the outside instance (mgmt interface)
    Value: !GetAtt OutsideMgmtENI.PrimaryPrivateIpAddress

  LinuxOutsideDataIP:
    Description: Private IPv4 address of the outside data interface
    Value: !GetAtt OutsideDataENI.PrimaryPrivateIpAddress

  LinuxInsideMgmtIPv6:
    Description: IPv6 address of the inside instance management interface
    Value: !Select [0, !GetAtt InsideMgmtENI.Ipv6Addresses]

  LinuxInsideDataIPv6:
    Description: IPv6 address of the inside data interface
    Value: !Select [0, !GetAtt InsideDataENI.Ipv6Addresses]

  LinuxOutsideMgmtIPv6:
    Description: IPv6 address of the outside instance management interface
    Value: !Select [0, !GetAtt OutsideMgmtENI.Ipv6Addresses]

  LinuxOutsideDataIPv6:
    Description: IPv6 address of the outside data interface
    Value: !Select [0, !GetAtt OutsideDataENI.Ipv6Addresses]