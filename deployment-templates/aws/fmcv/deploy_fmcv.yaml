AWSTemplateFormatVersion: '2010-09-09'
Description: Stack deploying NGFWv testbed

Parameters:
  FMCvInstanceType:
    Default: c5.4xlarge
    Description: FMCv instance type
    Type: String
  Prefix:
    Default: 'cim-cft'
    Description: Prefix for the resources
    Type: String
  Region:
    Default: us-east-1
    Description: AWS Region to deploy the stack
    Type: String
  AvailabilityZone:
    Default: us-east-1a
    Description: Availability Zone for the subnets
    Type: String
  FMCvAMIID:
    Default: ''
    Description: FMCv AMI ID
    Type: String  
  KeyName:
    Default: virtual_production_keypair
    Description: Key pair name for SSH access to FMCv
    Type: String  
  AdminPassword:
    Default: c0mpleX@1209
    Description: Admin password for FMCv
    Type: String 
  FMCvSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Management subnet ID  
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for FMCv    
  Day0Config:
    Type: String
    Default: ''
    Description: Day 0 configuration (leave empty to use default)
  InstanceMetadataServiceVersion:
    Description: Select IMDS version to be used by the instances
    Type: String
    Default: "V2 only (token required) [IMDSv2 ONLY APPLICABLE FOR VERSION 7.6 AND ABOVE]"
    AllowedValues:
      - "V1 and V2 (token optional)"
      - "V2 only (token required) [IMDSv2 ONLY APPLICABLE FOR VERSION 7.6 AND ABOVE]"

Conditions:
  UseDefaultDay0Config: !Equals [!Ref Day0Config, '']
  EnableIMDSv2:
    Fn::Equals:
      - !Ref InstanceMetadataServiceVersion
      - "V2 only (token required) [IMDSv2 ONLY APPLICABLE FOR VERSION 7.6 AND ABOVE]"

Resources:
  FMCvNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref FMCvSubnetId
      GroupSet:
        - !Ref SecurityGroupId
      Ipv6AddressCount: 1
      Tags:
        - Key: Name
          Value: !Sub ${Prefix}-FMCv-ENI

  FMCv:
    Type: AWS::EC2::Instance
    Properties:
      MetadataOptions:
        Fn::If:
          - EnableIMDSv2
          - HttpEndpoint: enabled
            HttpTokens: required
            HttpPutResponseHopLimit: 1
          - !Ref "AWS::NoValue"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            VolumeType: gp3
      ImageId: !Ref FMCvAMIID
      InstanceType: !Ref FMCvInstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref FMCvNetworkInterface
          DeviceIndex: 0
      Tags:
        - Key: Name
          Value: !Sub ${Prefix}-FMCv
        - Key: autostop
          Value: 'false'
      UserData:
        Fn::Base64: !If
          - UseDefaultDay0Config
          - !Sub |
              #MC
              {
              "AdminPassword": "${AdminPassword}",
              "Hostname": "fmcv-aws",
              "IPv4Mode": "DHCP",
              "IPv6Mode": "DHCP"}
          - !Ref Day0Config

  FMCvEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${Prefix}-FMCv-EIP

  FMCvEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    DependsOn: FMCv
    Properties:
      AllocationId: !GetAtt FMCvEIP.AllocationId
      NetworkInterfaceId: !Ref FMCvNetworkInterface

Outputs:
  FMCvId:
    Description: FMCv Instance ID
    Value: !Ref FMCv
  FMCvSSHIP:
    Description: Public IP address of the FMCv instance
    Value: !Ref FMCvEIP
  FMCvPrivateIP:
    Description: Private IP address of the FMCv instance
    Value: !GetAtt FMCvNetworkInterface.PrimaryPrivateIpAddress
  FMCvIPv6:
    Description: IPv6 address of the FMCv instance
    Value: !GetAtt FMCvNetworkInterface.PrimaryIpv6Address
